<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatDock</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #e5e7eb; }
    .app { display: grid; grid-template-columns: 260px 1fr 340px; height: 100vh; transition: grid-template-columns .18s ease; }
    .app.sidebar-collapsed { grid-template-columns: 64px 1fr 340px; }
    aside, .settings { border-right: 1px solid #1f2937; background: #0f172a; overflow: auto; }
    aside { overflow-x: hidden; }
    .settings { border-right: 0; border-left: 1px solid #1f2937; padding: 16px; }
    .sidebar-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 16px; }
    .brand { min-width: 0; flex: 1; font-weight: 800; font-size: 22px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
    .brand-text { display: inline-block; }
    .sub { color: #94a3b8; font-size: 12px; margin-top: 4px; font-weight: 400; }
    button { background: #2563eb; color: white; border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
    button.secondary { background: #1f2937; }
    button.danger { background: #991b1b; }
    button:disabled { opacity: .6; cursor: wait; }
    .sidebar-toggle { flex: 0 0 34px; width: 34px; height: 34px; padding: 0; border-radius: 12px; background: #1f2937; font-size: 18px; line-height: 34px; }
    .new { margin: 0 12px 12px; width: calc(100% - 24px); white-space: nowrap; overflow: hidden; }
    .prompt-box { margin: 0 12px 12px; padding: 10px; border: 1px solid #1f2937; border-radius: 14px; background: #111827; }
    .prompt-box label { margin: 0 0 6px; font-size: 12px; color: #94a3b8; }
    .prompt-row { display: flex; gap: 8px; align-items: center; }
    .prompt-row select { flex: 1; min-width: 0; }
    .prompt-add { flex: 0 0 38px; width: 38px; height: 38px; padding: 0; border-radius: 10px; background: #1f2937; }
    select { width: 100%; border-radius: 10px; border: 1px solid #334155; background: #020617; color: #e5e7eb; padding: 9px; outline: none; }
    .session { padding: 12px 14px; border-top: 1px solid #1f2937; cursor: pointer; color: #cbd5e1; }
    .session:hover, .session.active { background: #172554; color: #fff; }
    .session-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-meta { color: #64748b; font-size: 12px; margin-top: 4px; }
    main { display: flex; flex-direction: column; min-width: 0; }
    .topbar { height: 56px; padding: 14px 18px; border-bottom: 1px solid #1f2937; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .top-left { min-width: 0; display: flex; align-items: center; gap: 10px; }
    #title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mobile-menu { display: none; background: #1f2937; width: 38px; height: 38px; padding: 0; border-radius: 12px; font-size: 20px; line-height: 38px; }
    .sidebar-mask { display: none; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .theme-toggle { background: #1f2937; white-space: nowrap; }
    .messages { flex: 1; overflow: auto; padding: 22px; }
    .msg { max-width: 900px; margin: 0 auto 16px; padding: 14px 16px; border-radius: 14px; line-height: 1.7; white-space: pre-wrap; }
    .user { background: #1d4ed8; color: white; }
    .assistant { background: #111827; border: 1px solid #263244; }
    .reasoning { display: none; margin-bottom: 12px; padding: 10px 12px; border-left: 3px solid #64748b; border-radius: 10px; background: #0b1220; color: #94a3b8; font-size: 13px; line-height: 1.6; }
    .reasoning.show { display: block; }
    .reasoning-title { font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
    .answer { min-height: 1.5em; }
    .markdown { white-space: normal; overflow-wrap: anywhere; }
    .markdown p { margin: 0 0 10px; }
    .markdown p:last-child { margin-bottom: 0; }
    .markdown h1, .markdown h2, .markdown h3, .markdown h4 { margin: 14px 0 8px; line-height: 1.35; color: #f8fafc; }
    .markdown h1 { font-size: 22px; }
    .markdown h2 { font-size: 20px; }
    .markdown h3 { font-size: 18px; }
    .markdown h4 { font-size: 16px; }
    .markdown ul, .markdown ol { margin: 8px 0 12px 22px; padding: 0; }
    .markdown li { margin: 4px 0; }
    .markdown blockquote { margin: 10px 0; padding: 8px 12px; border-left: 3px solid #475569; background: #0f172a; color: #cbd5e1; border-radius: 8px; }
    .markdown pre { margin: 10px 0; padding: 12px; border-radius: 10px; overflow: auto; background: #020617; border: 1px solid #1f2937; }
    .markdown code { padding: 2px 5px; border-radius: 6px; background: #020617; color: #e2e8f0; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .92em; }
    .markdown pre code { padding: 0; background: transparent; white-space: pre; }
    .markdown a { color: #93c5fd; text-decoration: none; }
    .markdown a:hover { text-decoration: underline; }
    .markdown .table-wrap { margin: 10px 0 14px; overflow-x: auto; border: 1px solid #1f2937; border-radius: 10px; }
    .markdown table { width: 100%; min-width: 420px; border-collapse: collapse; background: #020617; }
    .markdown th, .markdown td { padding: 9px 11px; border-bottom: 1px solid #1f2937; border-right: 1px solid #1f2937; text-align: left; vertical-align: top; }
    .markdown th:last-child, .markdown td:last-child { border-right: 0; }
    .markdown tr:last-child td { border-bottom: 0; }
    .markdown th { background: #0f172a; color: #e2e8f0; font-weight: 700; }
    .reasoning .markdown h1, .reasoning .markdown h2, .reasoning .markdown h3, .reasoning .markdown h4 { color: #cbd5e1; }
    .composer { border-top: 1px solid #1f2937; padding: 14px; display: flex; gap: 10px; }
    .quick-control, .stream-control { flex: 0 0 auto; min-width: 68px; }
    .stream-control[hidden] { display: none; }
    textarea, input { width: 100%; border-radius: 10px; border: 1px solid #334155; background: #020617; color: #e5e7eb; padding: 10px; outline: none; }
    textarea { min-height: 54px; max-height: 160px; resize: vertical; }
    label { display: block; color: #cbd5e1; font-size: 13px; margin: 14px 0 6px; }
    .hint { color: #64748b; font-size: 12px; line-height: 1.5; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: #cbd5e1; font-size: 13px; }
    .check-row input { width: auto; }
    .empty { color: #64748b; text-align: center; margin-top: 15vh; }
    .app.sidebar-collapsed .sidebar-head { padding-left: 15px; padding-right: 15px; }
    .app.sidebar-collapsed .brand { flex: 0 0 0; width: 0; }
    .app.sidebar-collapsed .brand-text,
    .app.sidebar-collapsed .sub,
    .app.sidebar-collapsed .new-label,
    .app.sidebar-collapsed .prompt-box,
    .app.sidebar-collapsed #sessions { display: none; }
    .app.sidebar-collapsed .new { width: 40px; margin: 0 12px 12px; padding-left: 0; padding-right: 0; }

    body.theme-light { background: #f6f8fb; color: #0f172a; }
    body.theme-light aside,
    body.theme-light .settings { background: #ffffff; border-color: #e2e8f0; }
    body.theme-light .topbar,
    body.theme-light .composer { border-color: #e2e8f0; background: #f8fafc; }
    body.theme-light .sub,
    body.theme-light .session-meta,
    body.theme-light .hint,
    body.theme-light .empty { color: #64748b; }
    body.theme-light .sidebar-toggle,
    body.theme-light .mobile-menu,
    body.theme-light .theme-toggle,
    body.theme-light .prompt-add,
    body.theme-light button.secondary { background: #e2e8f0; color: #0f172a; }
    body.theme-light .prompt-box { background: #f8fafc; border-color: #e2e8f0; }
    body.theme-light .prompt-box label { color: #64748b; }
    body.theme-light select,
    body.theme-light textarea,
    body.theme-light input { background: #ffffff; color: #0f172a; border-color: #cbd5e1; }
    body.theme-light .session { border-color: #e2e8f0; color: #334155; }
    body.theme-light .session:hover,
    body.theme-light .session.active { background: #dbeafe; color: #1e3a8a; }
    body.theme-light .assistant { background: #ffffff; border-color: #dbe3ee; box-shadow: 0 8px 24px rgba(15, 23, 42, .05); }
    body.theme-light .user { background: #2563eb; color: #ffffff; }
    body.theme-light .reasoning { background: #f1f5f9; color: #475569; border-left-color: #94a3b8; }
    body.theme-light .reasoning-title { color: #334155; }
    body.theme-light .markdown h1,
    body.theme-light .markdown h2,
    body.theme-light .markdown h3,
    body.theme-light .markdown h4 { color: #0f172a; }
    body.theme-light .markdown blockquote { background: #f8fafc; color: #334155; border-left-color: #94a3b8; }
    body.theme-light .markdown pre { background: #0f172a; border-color: #1e293b; color: #e2e8f0; }
    body.theme-light .markdown code { background: #e2e8f0; color: #0f172a; }
    body.theme-light .markdown pre code { background: transparent; color: #e2e8f0; }
    body.theme-light .markdown a { color: #2563eb; }
    body.theme-light .markdown .table-wrap { border-color: #dbe3ee; }
    body.theme-light .markdown table { background: #ffffff; }
    body.theme-light .markdown th,
    body.theme-light .markdown td { border-color: #e2e8f0; }
    body.theme-light .markdown th { background: #f1f5f9; color: #0f172a; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 220px 1fr; }
      .app.sidebar-collapsed { grid-template-columns: 64px 1fr; }
      .settings { display:none; }
    }
    @media (max-width: 720px) {
      html, body { height: 100%; overflow: hidden; }
      .app, .app.sidebar-collapsed { display: block; height: 100dvh; }
      main { height: 100dvh; }
      .topbar { height: 52px; padding: 8px 10px; }
      .top-left { flex: 1; }
      .mobile-menu { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 38px; }
      .topbar .danger, .theme-toggle { flex: 0 0 auto; padding: 9px 10px; }
      .top-actions { gap: 6px; }
      aside { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; width: min(86vw, 320px); transform: translateX(-102%); transition: transform .18s ease; box-shadow: 0 18px 60px rgba(0,0,0,.45); }
      .app:not(.sidebar-collapsed) aside { transform: translateX(0); }
      .app.sidebar-collapsed aside { transform: translateX(-102%); }
      .app.sidebar-collapsed .brand { flex: 1; width: auto; }
      .app.sidebar-collapsed .brand-text,
      .app.sidebar-collapsed .sub,
      .app.sidebar-collapsed .new-label,
      .app.sidebar-collapsed .prompt-box,
      .app.sidebar-collapsed #sessions { display: block; }
      .app.sidebar-collapsed .new { width: calc(100% - 24px); padding: 10px 12px; }
      .sidebar-mask.show { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(2, 6, 23, .58); backdrop-filter: blur(2px); }
      .messages { padding: 12px 10px; }
      .msg { max-width: none; margin: 0 0 10px; padding: 12px 13px; border-radius: 12px; font-size: 15px; line-height: 1.65; }
      .composer { padding: 10px; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
      .composer textarea { flex: 1 1 100%; min-height: 48px; max-height: 36dvh; font-size: 16px; }
      .composer button { flex: 1 1 0; min-width: 64px; padding: 10px 8px; }
      .quick-control, .stream-control { min-width: 0; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="sidebarMask" class="sidebar-mask" onclick="closeSidebarOnMobile()"></div>
<div class="app" id="app">
  <aside>
    <div class="sidebar-head">
      <div class="brand"><span class="brand-text">ChatDock</span><div class="sub">自用轻量 AI 对话中控</div></div>
      <button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()" title="折叠侧栏" aria-label="折叠侧栏">‹</button>
    </div>
    <div class="prompt-box">
      <label>系统提示词空间</label>
      <div class="prompt-row">
        <select id="promptSelector" onchange="selectPrompt(this.value)"></select>
        <button class="prompt-add" onclick="createPromptSpace()" title="新建提示词空间">+</button>
      </div>
    </div>
    <button class="new" onclick="newSession()" title="新会话">+ <span class="new-label">新会话</span></button>
    <div id="sessions"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="top-left">
        <button class="mobile-menu" onclick="toggleSidebar()" title="会话列表" aria-label="会话列表">☰</button>
        <div id="title">未选择会话</div>
      </div>
      <div class="top-actions">
        <button id="themeToggle" class="theme-toggle" onclick="toggleTheme()" title="切换白天/夜晚">夜晚</button>
        <button class="danger" onclick="deleteCurrent()">删除</button>
      </div>
    </div>
    <div id="messages" class="messages"><div class="empty">创建一个会话，然后开始聊天。</div></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息。Enter 发送，Shift+Enter 换行。"></textarea>
      <button id="continueBtn" class="secondary quick-control" onclick="sendQuickMessage('继续')" title="自动发送继续">继续</button>
      <button id="pauseStream" class="secondary stream-control" onclick="toggleStreamPause()" hidden disabled>暂停</button>
      <button id="stopStream" class="danger stream-control" onclick="stopStreaming()" hidden disabled>中断</button>
      <button id="send" onclick="sendMsg()">发送</button>
    </div>
  </main>

  <section class="settings">
    <h2 style="margin:0 0 8px">设置</h2>
    <div class="hint">兼容 OpenAI Chat Completions 的接口。比如 OpenAI、OpenRouter、One API、New API、Ollama OpenAI 兼容接口。</div>
    <label>Base URL</label>
    <input id="base_url" placeholder="https://api.openai.com/v1" />
    <label>API Key</label>
    <input id="api_key" placeholder="留空表示不修改" type="password" />
    <label>Model</label>
    <input id="model" placeholder="gpt-4o-mini" />
    <label>System Prompt</label>
    <textarea id="system_prompt" style="min-height:130px"></textarea>
    <div class="row">
      <div><label>上下文消息数</label><input id="max_context_messages" type="number" min="1" max="100" /></div>
      <div><label>Temperature</label><input id="temperature" type="number" min="0" max="2" step="0.1" /></div>
    </div>
    <label class="check-row"><input id="enable_thinking" type="checkbox" /> 启用模型思考</label>
    <label class="check-row"><input id="hide_thinking" type="checkbox" /> 自动隐藏 &lt;think&gt; 思考内容</label>
    <br />
    <button onclick="saveConfig()">保存设置</button>
    <p class="hint">省 token 核心：只带最近 N 条上下文 + 固定系统提示词。思考开关会通过 chat_template_kwargs.enable_thinking 传给模型接口；是否生效取决于模型服务是否支持该参数。</p>
  </section>
</div>
<script>
let current = null;
let busy = false;
let activeAbortController = null;
let activeAssistantEl = null;
let activeReasoningEl = null;
let activeAnswerEl = null;
let streamPaused = false;
let pendingDelta = '';
let pendingReasoning = '';
let activeAnswerBuffer = '';
let activeReasoningBuffer = '';

async function api(path, opt={}) {
  const res = await fetch(path, {headers: {'Content-Type':'application/json'}, ...opt});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fmtTime(value) { try { return new Date(value).toLocaleString(); } catch { return ''; } }

function initTheme() {
  const saved = localStorage.getItem('chatdock.theme') || 'night';
  setTheme(saved === 'day' ? 'day' : 'night');
}

function toggleTheme() {
  const next = document.body.classList.contains('theme-light') ? 'night' : 'day';
  setTheme(next);
}

function setTheme(theme) {
  const isDay = theme === 'day';
  document.body.classList.toggle('theme-light', isDay);
  document.body.classList.toggle('theme-night', !isDay);
  localStorage.setItem('chatdock.theme', isDay ? 'day' : 'night');
  if (typeof themeToggle !== 'undefined' && themeToggle) {
    themeToggle.textContent = isDay ? '白天' : '夜晚';
    themeToggle.title = isDay ? '当前：白天，点击切换夜晚' : '当前：夜晚，点击切换白天';
    themeToggle.setAttribute('aria-label', themeToggle.title);
  }
}

function initSidebar() {
  const saved = localStorage.getItem('chatdock.sidebarCollapsed');
  const collapsed = saved == null ? isMobileViewport() : saved === '1';
  setSidebarCollapsed(collapsed);
  window.addEventListener('resize', syncSidebarMask);
}

function toggleSidebar() {
  setSidebarCollapsed(!app.classList.contains('sidebar-collapsed'));
}

function setSidebarCollapsed(collapsed) {
  app.classList.toggle('sidebar-collapsed', collapsed);
  sidebarToggle.textContent = collapsed ? '›' : '‹';
  sidebarToggle.title = collapsed ? '展开侧栏' : '折叠侧栏';
  sidebarToggle.setAttribute('aria-label', sidebarToggle.title);
  localStorage.setItem('chatdock.sidebarCollapsed', collapsed ? '1' : '0');
  syncSidebarMask();
}

function isMobileViewport() {
  return window.matchMedia('(max-width: 720px)').matches;
}

function syncSidebarMask() {
  sidebarMask.classList.toggle('show', isMobileViewport() && !app.classList.contains('sidebar-collapsed'));
}

function closeSidebarOnMobile() {
  if (isMobileViewport()) setSidebarCollapsed(true);
}

async function loadConfig() {
  const c = await api('/api/config');
  base_url.value = c.base_url || '';
  api_key.value = '';
  api_key.placeholder = c.has_api_key ? '已保存，留空不修改' : '未设置';
  model.value = c.model || '';
  system_prompt.value = c.system_prompt || '';
  max_context_messages.value = c.max_context_messages || 12;
  temperature.value = c.temperature ?? 0.7;
  enable_thinking.checked = !!c.enable_thinking;
  hide_thinking.checked = c.hide_thinking !== false;
}

async function saveConfig() {
  await api('/api/config', {method:'POST', body: JSON.stringify({
    base_url: base_url.value,
    api_key: api_key.value,
    model: model.value,
    system_prompt: system_prompt.value,
    max_context_messages: Number(max_context_messages.value || 12),
    temperature: Number(temperature.value || 0.7),
    enable_thinking: enable_thinking.checked,
    hide_thinking: hide_thinking.checked,
  })});
  api_key.value = '';
  await loadConfig();
  alert('已保存');
}

async function loadSessions() {
  const list = await api('/api/sessions');
  sessions.innerHTML = list.map(s => '<div class="session ' + (current===s.id?'active':'') + '" onclick="openSession(\'' + s.id + '\')">' +
    '<div class="session-title">' + escapeHtml(s.title) + '</div>' +
    '<div class="session-meta">' + s.count + ' 条 · ' + fmtTime(s.updated_at) + '</div>' +
  '</div>').join('');
}

async function newSession() {
  const s = await api('/api/sessions', {method:'POST', body:'{}'});
  current = s.id;
  await loadSessions();
  await renderSession(s);
  closeSidebarOnMobile();
}

async function openSession(id) {
  current = id;
  const s = await api('/api/sessions/' + id);
  await loadSessions();
  await renderSession(s);
  closeSidebarOnMobile();
}

async function deleteCurrent() {
  if (!current || !confirm('确定删除当前会话？')) return;
  await api('/api/sessions/' + current, {method:'DELETE'});
  current = null;
  title.textContent = '未选择会话';
  messages.innerHTML = '<div class="empty">创建一个会话，然后开始聊天。</div>';
  await loadSessions();
}

async function renderSession(s) {
  title.textContent = s.title || '新会话';
  if (!s.messages || s.messages.length === 0) {
    messages.innerHTML = '<div class="empty">这个会话还没有消息。</div>';
    return;
  }
  messages.innerHTML = s.messages.map(renderMessage).join('');
  messages.scrollTop = messages.scrollHeight;
}

function setStreamControls(active) {
  pauseStream.hidden = !active;
  stopStream.hidden = !active;
  pauseStream.disabled = !active;
  stopStream.disabled = !active;
  stopStream.textContent = '中断';
  send.disabled = active;
  continueBtn.disabled = active;
  if (!active) {
    activeAbortController = null;
    activeAssistantEl = null;
    activeReasoningEl = null;
    activeAnswerEl = null;
    streamPaused = false;
    pendingDelta = '';
    pendingReasoning = '';
    activeAnswerBuffer = '';
    activeReasoningBuffer = '';
    pauseStream.textContent = '暂停';
    pauseStream.title = '暂停显示输出';
    pauseStream.setAttribute('aria-label', pauseStream.title);
  }
}

function toggleStreamPause() {
  if (!busy) return;
  streamPaused = !streamPaused;
  pauseStream.textContent = streamPaused ? '继续' : '暂停';
  pauseStream.title = streamPaused ? '继续显示输出' : '暂停显示输出';
  pauseStream.setAttribute('aria-label', pauseStream.title);
  if (!streamPaused) {
    if (pendingReasoning && activeReasoningEl) {
      appendReasoning(pendingReasoning);
      pendingReasoning = '';
    }
    if (pendingDelta && activeAnswerEl) {
      appendAnswer(pendingDelta);
      pendingDelta = '';
    }
    messages.scrollTop = messages.scrollHeight;
  }
}

function stopStreaming() {
  if (!busy || !activeAbortController) return;
  stopStream.disabled = true;
  stopStream.textContent = '中断中';
  activeAbortController.abort();
}

function sendQuickMessage(text) {
  if (busy) return;
  input.value = text;
  sendMsg();
}

function renderMessage(m) {
  const role = m.role || '';
  const content = m.content || '';
  if (role === 'assistant') {
    return '<div class="msg assistant markdown">' + renderMarkdown(content) + '</div>';
  }
  return '<div class="msg ' + escapeHtml(role) + '">' + escapeHtml(content) + '</div>';
}

function appendReasoning(text) {
  if (!text || !activeReasoningEl) return;
  activeReasoningBuffer += text;
  activeReasoningEl.classList.add('show');
  const contentEl = activeReasoningEl.querySelector('.reasoning-content');
  if (contentEl) contentEl.innerHTML = renderMarkdown(activeReasoningBuffer);
}

function appendAnswer(text) {
  if (!text || !activeAnswerEl) return;
  activeAnswerBuffer += text;
  activeAnswerEl.innerHTML = renderMarkdown(activeAnswerBuffer);
}

async function sendMsg() {
  if (busy) return;
  if (!current) await newSession();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  busy = true;
  activeAbortController = new AbortController();
  setStreamControls(true);

  const assistantId = 'assistant-' + Date.now();
  const reasoningId = assistantId + '-reasoning';
  const answerId = assistantId + '-answer';
  messages.innerHTML += '<div class="msg user">' + escapeHtml(text) + '</div>' +
    '<div class="msg assistant" id="' + assistantId + '">' +
      '<div class="reasoning" id="' + reasoningId + '"><div class="reasoning-title">思考</div><div class="reasoning-content markdown"></div></div>' +
      '<div class="answer markdown" id="' + answerId + '"></div>' +
    '</div>';
  const assistantEl = document.getElementById(assistantId);
  activeAssistantEl = assistantEl;
  activeReasoningEl = document.getElementById(reasoningId);
  activeAnswerEl = document.getElementById(answerId);
  activeReasoningBuffer = '';
  activeAnswerBuffer = '';
  messages.scrollTop = messages.scrollHeight;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: current, message: text}),
      signal: activeAbortController.signal
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || res.statusText);
    }

    let finalSession = null;
    await readSSE(res, (event, data) => {
      if (event === 'delta') {
        const reasoning = data.reasoning_content || '';
        const content = data.content || '';
        if (streamPaused) {
          pendingReasoning += reasoning;
          pendingDelta += content;
        } else {
          if (reasoning) appendReasoning(reasoning);
          if (content) appendAnswer(content);
          messages.scrollTop = messages.scrollHeight;
        }
      } else if (event === 'done') {
        finalSession = data.session;
      } else if (event === 'error') {
        throw new Error(data.message || 'stream error');
      }
    });

    if (finalSession) {
      pendingDelta = '';
      pendingReasoning = '';
      await loadSessions();
    }
  } catch (e) {
    if (activeAbortController && activeAbortController.signal.aborted) {
      if (pendingReasoning) {
        appendReasoning(pendingReasoning);
        pendingReasoning = '';
      }
      if (pendingDelta) {
        appendAnswer(pendingDelta);
        pendingDelta = '';
      }
      appendAnswer((activeAnswerBuffer ? '\n\n' : '') + '【已中断】');
      messages.scrollTop = messages.scrollHeight;
      await loadSessions().catch(() => {});
    } else {
      assistantEl.textContent = '错误：' + e.message;
    }
  } finally {
    busy = false;
    setStreamControls(false);
  }
}

async function readSSE(res, onEvent) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const parts = buffer.split('\n\n');
    buffer = parts.pop() || '';
    for (const part of parts) {
      const event = parseSSE(part);
      if (event) onEvent(event.event, event.data);
    }
  }
  if (buffer.trim()) {
    const event = parseSSE(buffer);
    if (event) onEvent(event.event, event.data);
  }
}

function parseSSE(block) {
  let event = 'message';
  const dataLines = [];
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
  }
  if (!dataLines.length) return null;
  return {event, data: JSON.parse(dataLines.join('\n'))};
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

function renderMarkdown(value) {
  const lines = String(value || '').replace(/\r\n/g, '\n').split('\n');
  const html = [];
  let paragraph = [];
  let listType = null;
  let listItems = [];
  let inCode = false;
  let codeLines = [];
  let codeLang = '';

  function flushParagraph() {
    if (!paragraph.length) return;
    html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
    paragraph = [];
  }
  function flushList() {
    if (!listType) return;
    html.push('<' + listType + '>' + listItems.map(item => '<li>' + renderInline(item) + '</li>').join('') + '</' + listType + '>');
    listType = null;
    listItems = [];
  }
  function flushCode() {
    const langClass = codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : '';
    html.push('<pre><code' + langClass + '>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
    inCode = false;
    codeLines = [];
    codeLang = '';
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const fence = line.match(/^\s*```\s*([^`]*)\s*$/);
    if (fence) {
      if (inCode) {
        flushCode();
      } else {
        flushParagraph();
        flushList();
        inCode = true;
        codeLang = fence[1].trim().replace(/[^\w#+.-]/g, '');
      }
      continue;
    }
    if (inCode) {
      codeLines.push(line);
      continue;
    }
    if (isMarkdownTable(lines, i)) {
      flushParagraph();
      flushList();
      const table = readMarkdownTable(lines, i);
      html.push(renderMarkdownTable(table.rows, table.alignments));
      i = table.nextIndex - 1;
      continue;
    }
    if (!line.trim()) {
      flushParagraph();
      flushList();
      continue;
    }
    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      flushParagraph();
      flushList();
      const level = heading[1].length;
      html.push('<h' + level + '>' + renderInline(heading[2].trim()) + '</h' + level + '>');
      continue;
    }
    const quote = line.match(/^>\s?(.+)$/);
    if (quote) {
      flushParagraph();
      flushList();
      html.push('<blockquote>' + renderInline(quote[1].trim()) + '</blockquote>');
      continue;
    }
    const unordered = line.match(/^\s*[-*+]\s+(.+)$/);
    const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if (unordered || ordered) {
      flushParagraph();
      const nextType = unordered ? 'ul' : 'ol';
      if (listType && listType !== nextType) flushList();
      listType = nextType;
      listItems.push((unordered || ordered)[1]);
      continue;
    }
    paragraph.push(line.trim());
  }
  if (inCode) flushCode();
  flushParagraph();
  flushList();
  return html.join('') || '';
}

function isMarkdownTable(lines, index) {
  if (index + 1 >= lines.length) return false;
  const header = splitMarkdownTableRow(lines[index]);
  const separator = splitMarkdownTableRow(lines[index + 1]);
  if (header.length < 2 || separator.length < 2 || header.length !== separator.length) return false;
  return separator.every(cell => /^:?-{3,}:?$/.test(cell.trim()));
}

function readMarkdownTable(lines, index) {
  const rows = [splitMarkdownTableRow(lines[index])];
  const separator = splitMarkdownTableRow(lines[index + 1]);
  const alignments = separator.map(cell => {
    cell = cell.trim();
    if (cell.startsWith(':') && cell.endsWith(':')) return 'center';
    if (cell.endsWith(':')) return 'right';
    return 'left';
  });
  let nextIndex = index + 2;
  while (nextIndex < lines.length) {
    const row = splitMarkdownTableRow(lines[nextIndex]);
    if (row.length !== rows[0].length) break;
    rows.push(row);
    nextIndex++;
  }
  return {rows, alignments, nextIndex};
}

function splitMarkdownTableRow(line) {
  const trimmed = String(line || '').trim();
  if (!trimmed.includes('|')) return [];
  const body = trimmed.replace(/^\|/, '').replace(/\|$/, '');
  const cells = [];
  let current = '';
  let escaped = false;
  for (const ch of body) {
    if (escaped) {
      current += ch;
      escaped = false;
      continue;
    }
    if (ch === '\\') {
      escaped = true;
      continue;
    }
    if (ch === '|') {
      cells.push(current.trim());
      current = '';
      continue;
    }
    current += ch;
  }
  cells.push(current.trim());
  return cells;
}

function renderMarkdownTable(rows, alignments) {
  const head = rows[0] || [];
  const body = rows.slice(1);
  const ths = head.map((cell, i) => '<th style="text-align:' + alignments[i] + '">' + renderInline(cell) + '</th>').join('');
  const trs = body.map(row => '<tr>' + row.map((cell, i) => '<td style="text-align:' + alignments[i] + '">' + renderInline(cell) + '</td>').join('') + '</tr>').join('');
  return '<div class="table-wrap"><table><thead><tr>' + ths + '</tr></thead><tbody>' + trs + '</tbody></table></div>';
}

function renderInline(value) {
  let html = escapeHtml(value);
  const codes = [];
  html = html.replace(/`([^`]+)`/g, (_, code) => {
    const key = '\u0000CODE' + codes.length + '\u0000';
    codes.push('<code>' + code + '</code>');
    return key;
  });
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+|#[^\s)]+)\)/g, (_, text, url) => {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
  });
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/(^|\s)\*([^*]+)\*/g, '$1<em>$2</em>');
  html = html.replace(/(^|\s)_([^_]+)_/g, '$1<em>$2</em>');
  for (let i = 0; i < codes.length; i++) {
    html = html.replace('\u0000CODE' + i + '\u0000', codes[i]);
  }
  return html;
}

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

async function loadPrompts() {
  const data = await api('/api/prompts');
  promptSelector.innerHTML = data.prompts.map(p => {
    const label = escapeHtml(p.name) + '（' + p.count + '）' + (p.active ? ' ✔' : '');
    return '<option value="' + escapeHtml(p.name) + '" ' + (p.active ? 'selected' : '') + '>' + label + '</option>';
  }).join('');
}

async function selectPrompt(name) {
  if (busy || !name) return;
  await api('/api/prompts/select', {method:'POST', body: JSON.stringify({name})});
  current = null;
  title.textContent = '未选择会话';
  messages.innerHTML = '<div class="empty">已切换提示词空间。创建或选择一个会话。</div>';
  await loadPrompts();
  await loadConfig();
  await loadSessions();
  closeSidebarOnMobile();
}

async function createPromptSpace() {
  if (busy) return;
  const name = prompt('新提示词空间名称：');
  if (!name || !name.trim()) return;
  const systemPrompt = prompt('系统提示词内容：', system_prompt.value || '');
  await api('/api/prompts', {method:'POST', body: JSON.stringify({name: name.trim(), system_prompt: systemPrompt || ''})});
  current = null;
  title.textContent = '未选择会话';
  messages.innerHTML = '<div class="empty">已创建并切换到新提示词空间。</div>';
  await loadPrompts();
  await loadConfig();
  await loadSessions();
  closeSidebarOnMobile();
}

initTheme();
initSidebar();
loadPrompts();
loadConfig();
loadSessions();
</script>
