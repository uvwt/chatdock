services:
  chatdock:
    build: .
    image: chatdock:local
    container_name: chatdock
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      CHATDOCK_ADDR: :8720
      CHATDOCK_DATA: /data
      CHATDOCK_PUBLIC_BASE_URL: https://chatdock.200399.xyz
    ports:
      - "127.0.0.1:8720:8720"
    volumes:
      - ./data:/data
      - ./backups:/backups:ro
    networks:
      - default
      - bge-m3_default

networks:
  bge-m3_default:
    external: true
