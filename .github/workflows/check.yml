name: Check

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # PR 默认检出 GitHub 生成的临时合并提交；完整历史用于定位真实的 PR HEAD。
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: make shell-check
      - run: test -z "$(gofmt -l cmd internal web/*.go)"
      - run: node --check web/vite.config.js
      - run: for f in web/src/lib/*.js web/src/lib/*.mjs web/src/hooks/*.js; do [ -f "$f" ] && node --check "$f"; done
      - run: node scripts/check-css-health.mjs
      - run: node scripts/check-frontend.mjs
      - name: Check commit message
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commit-message.mjs --message "$(git log -1 --format=%s "$COMMIT_SHA")"
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: go vet ./...
      - run: go test ./...
      - run: git diff --check

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag chatdock:check .
